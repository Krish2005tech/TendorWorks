[project]
name = "tender-estimator"
version = "0.1.0"
description = "Evidence-backed government works estimates, concept drawings and BOQs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "langgraph-checkpoint-postgres>=2,<4", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1", "httpx>=0.27,<1", "numpy>=1.26,<3",
  "openpyxl>=3.1,<4", "python-docx>=1.1,<2", "reportlab>=4.2,<5",
  "ezdxf>=1.3,<2", "pypdf>=5,<7", "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2", "python-multipart>=0.0.18,<1",
  "langchain-nvidia-ai-endpoints>=0.3,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
tender = "tender.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
