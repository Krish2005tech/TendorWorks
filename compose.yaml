services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tender
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TENDER_DATABASE_URL: postgresql+psycopg://tender:${POSTGRES_PASSWORD:-local-demo-only}@postgres:5432/tender
      TENDER_DATA_DIR: /app/var
      TENDER_DATABASE_DIR: /app/database
      TENDER_MODE: demo
      TENDER_SEED_DEMO: "true"
    volumes:
      - application-data:/app/var
      - ./database:/app/database:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  application-data:
